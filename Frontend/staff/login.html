<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Login - PG Complaint Management</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #f4f6f8;
        }

        .login-container {
            width: 400px;
            max-width: 90%;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            margin-bottom: 18px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;
        }

        button {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 18px;

            text-align: center;

            font-weight: bold;
        }

        .back {
            display: block;

            margin-top: 20px;

            text-align: center;

            color: #2563eb;

            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="login-container">

    <h1>Staff Login</h1>

    <p class="subtitle">
        PG Complaint Management
    </p>


    <form id="loginForm">


        <label for="email">
            Staff Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter staff email"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >


        <button type="submit">
            Login
        </button>


    </form>


    <div id="message"></div>


    <a
        href="../index.html"
        class="back"
    >
        ← Back to Home
    </a>

</div>



<script>

// ======================================================
// STAFF LOGIN
// ======================================================

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {

            // Prevent normal form submission

            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();


            const password =
                document
                    .getElementById("password")
                    .value;


            const message =
                document
                    .getElementById("message");


            message.textContent =
                "Logging in...";


            try {

                // Send login request to backend

                const response =
                    await fetch(
                        "http://localhost:5000/api/staff/login",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    email: email,

                                    password: password

                                })

                        }
                    );


                const data =
                    await response.json();


                // Check whether login failed

                if (!response.ok) {

                    message.textContent =
                        data.message ||
                        "Staff login failed";

                    return;

                }


                // ==================================================
                // SECURITY CHECK
                // Make sure backend says this is a staff account
                // ==================================================

                if (
                    !data.user ||
                    data.user.role !== "staff"
                ) {

                    message.textContent =
                        "Access denied. Staff account required.";

                    return;

                }


                // ==================================================
                // STORE STAFF LOGIN INFORMATION
                // ==================================================

                localStorage.setItem(
                    "staffToken",
                    data.token
                );


                localStorage.setItem(
                    "staffUser",
                    JSON.stringify(data.user)
                );


                message.textContent =
                    "Login successful!";


                // ==================================================
                // OPEN STAFF DASHBOARD
                // ==================================================

                window.location.href =
                    "dashboard.html";


            } catch (error) {

                console.error(error);

                message.textContent =
                    "Unable to connect to server.";

            }

        }
    );

</script>


</body>

</html>
