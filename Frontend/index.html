
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PG Complaint Management</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <div class="container">

        <h1>PG Complaint Management</h1>

        <p class="subtitle">
            Manage and track PG complaints easily
        </p>


        <div class="role-container">


            <!-- ==================================================
                 RESIDENT SECTION
            ================================================== -->

            <div class="role-card">

                <h2>Resident</h2>

                <p>
                    Submit complaints and track their status.
                </p>


                <a href="resident/login.html">
                    <button>
                        Resident Login
                    </button>
                </a>


                <a href="resident/register.html">
                    <button class="secondary-button">
                        Create Resident Account
                    </button>
                </a>

            </div>



            <!-- ==================================================
                 STAFF SECTION
            ================================================== -->

            <div class="role-card">

                <h2>PG Staff</h2>

                <p>
                    Manage and resolve resident complaints.
                </p>


                <a href="staff/login.html">
                    <button>
                        Staff Login
                    </button>
                </a>


                <a href="staff/register.html">
                    <button class="secondary-button">
                        Staff Registration
                    </button>
                </a>

            </div>



            <!-- ==================================================
                 ADMIN SECTION
            ================================================== -->

            <div class="role-card">

                <h2>Admin</h2>

                <p>
                    Manage staff accounts and control the PG system.
                </p>


                <!-- Admin Login -->

               <a href="admin/login.html">

                    <button>
                        Admin Login
                    </button>

                </a>

            </div>


        </div>

    </div>

</body>

</html>
