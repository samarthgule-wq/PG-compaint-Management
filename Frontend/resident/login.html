<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resident Login - PG Complaint Management</title>

    <link rel="stylesheet" href="../style.css">

</head>


<body>

    <div class="container">

        <div class="role-card">

            <h1>Resident Login</h1>

            <p class="subtitle">
                Login to manage your PG complaints
            </p>


            <form id="residentLoginForm">

                <div>
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>


                <br>


                <div>
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>


                <br>


                <button type="submit">
                    Login
                </button>

            </form>


            <p id="message"></p>


            <br>


            <p>
                Don't have an account?
            </p>

            <a href="register.html">

                <button type="button" class="secondary-button">
                    Create Account
                </button>

            </a>


            <br><br>


            <a href="../index.html">
                ← Back to Home
            </a>

        </div>

    </div>


    <script>

        const form = document.getElementById("residentLoginForm");

        const message = document.getElementById("message");


        form.addEventListener("submit", async function(event) {

            event.preventDefault();


            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            message.textContent = "Logging in...";


            try {

                const response = await fetch(
                    "http://localhost:5000/api/resident/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );


                const data = await response.json();


                if (!response.ok) {

                    message.textContent =
                        data.message || "Login failed";

                    return;

                }


                // Store JWT token in browser
                localStorage.setItem(
                    "residentToken",
                    data.token
                );


                // Store resident information
                localStorage.setItem(
                    "residentUser",
                    JSON.stringify(data.user)
                );


                message.textContent =
                    "Login successful!";


                // Open resident dashboard
                window.location.href =
                    "dashboard.html";


            } catch (error) {

                console.error(error);

                message.textContent =
                    "Unable to connect to server";

            }

        });

    </script>

</body>

</html>
